apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: dashboard
data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Media:
        style: row
        columns: 4
      AI:
        style: row
        columns: 3
      Infrastructure:
        style: row
        columns: 4

  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short

  bookmarks.yaml: |
    []

  services.yaml: |
    - Media:
        - Jellyfin:
            icon: jellyfin.png
            href: https://jellyfin.home.romangzz.com
            description: Watch movies & TV
            siteMonitor: https://jellyfin.home.romangzz.com
        - qBittorrent:
            icon: qbittorrent.png
            href: https://qbittorrent.home.romangzz.com
            description: Torrent client, VPN-routed
            siteMonitor: https://qbittorrent.home.romangzz.com
        - Radarr:
            icon: radarr.png
            href: https://radarr.home.romangzz.com
            description: Movie management
            siteMonitor: https://radarr.home.romangzz.com
        - Sonarr:
            icon: sonarr.png
            href: https://sonarr.home.romangzz.com
            description: TV management
            siteMonitor: https://sonarr.home.romangzz.com
        - Bazarr:
            icon: bazarr.png
            href: https://bazarr.home.romangzz.com
            description: Subtitle management
            siteMonitor: https://bazarr.home.romangzz.com
        - Prowlarr:
            icon: prowlarr.png
            href: https://prowlarr.home.romangzz.com
            description: Indexer management
            siteMonitor: https://prowlarr.home.romangzz.com
        - ISO Extractor:
            icon: mdi-disc
            href: https://iso-extractor.home.romangzz.com
            description: Rip ISOs to MKV
            siteMonitor: https://iso-extractor.home.romangzz.com
        - Subgen:
            icon: mdi-closed-caption-outline
            href: https://subgen.home.romangzz.com
            description: Subtitle generation
            siteMonitor: https://subgen.home.romangzz.com
        - Whisper:
            icon: mdi-microphone-message
            href: https://whisper.home.romangzz.com
            description: Speech-to-text ASR
            siteMonitor: https://whisper.home.romangzz.com

    - AI:
        - Open WebUI:
            icon: openwebui.png
            href: https://chat.home.romangzz.com
            description: Chat with local models
            siteMonitor: https://chat.home.romangzz.com
        - Ollama:
            icon: ollama.png
            href: https://ollama.home.romangzz.com
            description: Local model server
            siteMonitor: https://ollama.home.romangzz.com
        - Hermes Agent:
            icon: mdi-robot-outline
            href: https://hermes.home.romangzz.com
            description: Messaging & cron agent gateway
            siteMonitor: https://hermes.home.romangzz.com

    - Infrastructure:
        - ArgoCD:
            icon: argo-cd.png
            href: https://argo.home.romangzz.com
            description: GitOps deployment
            siteMonitor: https://argo.home.romangzz.com
        - Grafana:
            icon: grafana.png
            href: https://grafana.home.romangzz.com
            description: Metrics & logs
            siteMonitor: https://grafana.home.romangzz.com
        - Omada Controller:
            icon: omada.png
            href: https://omada.home.romangzz.com
            description: Network & AP management
            siteMonitor: https://omada.home.romangzz.com
        - Authelia:
            icon: authelia.png
            href: https://auth.home.romangzz.com
            description: SSO login portal
            siteMonitor: https://auth.home.romangzz.com
        - n8n:
            icon: n8n.png
            href: https://n8n.home.romangzz.com
            description: Workflow automation
            siteMonitor: https://n8n.home.romangzz.com
