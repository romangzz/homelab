# Deliberately NOT gated by the authelia-forwardauth middleware -- this is
# the login portal itself, it must stay reachable unauthenticated.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia-ingress
  namespace: auth
spec:
  ingressClassName: traefik
  rules:
  - host: auth.home.romangzz.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: authelia
            port:
              number: 80
