apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: auth
data:
  configuration.yml: |
    theme: 'auto'

    server:
      address: 'tcp://0.0.0.0:9091'

    log:
      level: 'info'

    authentication_backend:
      password_reset:
        # No SMTP configured -- self-service reset is disabled. Re-run the
        # hash-generation step and update the sealed users_database.yml to
        # change the password instead.
        disable: true
      file:
        path: '/etc/authelia/users_database.yml'

    access_control:
      default_policy: 'one_factor'

    session:
      name: 'authelia_session'
      same_site: 'lax'
      expiration: '1h'
      inactivity: '15m'
      remember_me: '1M'
      cookies:
        - domain: 'home.romangzz.com'
          authelia_url: 'https://auth.home.romangzz.com'
          default_redirection_url: 'https://home.romangzz.com'

    storage:
      local:
        path: '/config/db.sqlite3'

    notifier:
      disable_startup_check: true
      filesystem:
        filename: '/config/notification.txt'
