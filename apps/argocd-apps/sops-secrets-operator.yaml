# Decrypts SopsSecret resources (apps/**/*.sops.yaml, encrypted client-side
# with sops + age, see .sops.yaml) into Kubernetes Secrets. Same role the
# Sealed Secrets controller plays for SealedSecret; see
# docs/secrets-migration.md.
#
# Bootstrap (once, by hand, never in git): the age private key must exist as
# Secret `sops-age-key` (key `keys.txt`) in namespace sops-secrets-operator.
# Until it does, the operator pod stays in ContainerCreating. See the README
# prerequisites for the command.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-secrets-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://isindir.github.io/sops-secrets-operator/
    chart: sops-secrets-operator
    targetRevision: 0.29.1
    helm:
      values: |
        secretsAsFiles:
          - name: sops-age-key
            mountPath: /etc/sops-age
            secretName: sops-age-key
        extraEnv:
          - name: SOPS_AGE_KEY_FILE
            value: /etc/sops-age/keys.txt

        # Stays false globally; the Phase 5 cutover sets
        # spec.enforceOwnership per SopsSecret to take over a Secret that a
        # SealedSecret currently owns.
        defaultEnforceOwnership: false

        securityContext:
          enabled: true

        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: sops-secrets-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
