# Traefik's IngressRoute CRD blocks cross-namespace middleware references
# by default (unlike the annotation-based form used on plain Ingress
# resources elsewhere in this repo), so this is a local copy of
# apps/authelia/middleware.yaml rather than a cross-namespace reference.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia-forwardauth
  namespace: argocd
spec:
  forwardAuth:
    address: "http://authelia.auth.svc.cluster.local/api/verify?rd=https://auth.home.romangzz.com"
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
