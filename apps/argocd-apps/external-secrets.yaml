# External Secrets Operator. Used here only for its in-cluster generators
# (e.g. `Password`), so internal random credentials are created in the
# cluster and never exist in git or on a laptop. No external SecretStore
# backend is configured. See docs/secrets-migration.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.14.0
    helm:
      values: |
        installCRDs: true

        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  # The cert-controller generates the webhook's TLS cert at runtime: it fills
  # the (chart-rendered, empty) external-secrets-webhook Secret and injects
  # the CA into the validating webhook configs. Without these ignores ArgoCD
  # would show them permanently OutOfSync and selfHeal could wipe the cert.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: ""
      kind: Secret
      name: external-secrets-webhook
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO's SecretStore/ClusterSecretStore CRDs are ~720KB each, far over
      # the 256KB last-applied-configuration annotation limit of
      # client-side apply.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
