apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-sysctl-tuner
  namespace: monitoring
  labels:
    app: node-sysctl-tuner
spec:
  selector:
    matchLabels:
      app: node-sysctl-tuner
  template:
    metadata:
      labels:
        app: node-sysctl-tuner
    spec:
      hostPID: true
      hostIPC: true
      hostNetwork: true
      initContainers:
      - name: sysctl-tuner
        image: busybox:1.36
        securityContext:
          privileged: true
        command:
        - sh
        - -c
        - |
          sysctl -w fs.inotify.max_user_watches=524288
          sysctl -w fs.inotify.max_user_instances=512
          echo "Host sysctl limits successfully increased!"
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 16Mi
