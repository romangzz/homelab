# Every Plane credential is generated in-cluster by External Secrets
# Operator and never exists in git or on a laptop (docs/secrets-migration.md,
# Phase 4). One generator run fills every password key, and one Secret
# (plane-secrets) carries all of them plus the URLs built from them, so the
# Postgres/RabbitMQ/MinIO passwords and the connection strings can't drift
# apart. The chart's six external_secrets.* names all point at it
# (apps/argocd-apps/plane.yaml); envFrom loads only the keys each workload
# reads, the rest are inert.
#
# DO NOT change refreshPolicy / creationPolicy / immutable. Postgres, RabbitMQ
# and MinIO bake their password into their data volumes on first start, so
# any regeneration would lock Plane out of its own data. All three settings
# are needed (each verified on this cluster, 2026-11-08):
# - refreshPolicy: CreatedOnce -> a normal or forced sync never regenerates.
# - creationPolicy: Orphan -> deleting/pruning this ExternalSecret doesn't
#   garbage-collect the Secret.
# - immutable: true -> a RE-CREATED ExternalSecret would otherwise generate
#   fresh passwords and overwrite the orphaned Secret; the API server refuses
#   to change an immutable Secret's data, so the originals survive.
# Consequence: these passwords exist ONLY in the cluster. Restoring Plane's
# PVCs from a backup needs the plane-secrets Secret restored with them.
# To deliberately rotate: wipe Plane's PVCs and delete Secret plane-secrets;
# ESO then generates a fresh one.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: plane-passwords
  namespace: plane
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 48
  digits: 12
  # Alphanumeric only: these are embedded unescaped in DATABASE_URL/AMQP_URL.
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - SECRET_KEY
    - LIVE_SERVER_SECRET_KEY
    - POSTGRES_PASSWORD
    - RABBITMQ_DEFAULT_PASS
    - MINIO_ROOT_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-secrets
  namespace: plane
  annotations:
    # Before the chart's workloads, so they never start without credentials.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: plane-secrets
    creationPolicy: Orphan
    immutable: true
    template:
      data:
        # app keys
        SECRET_KEY: "{{ .SECRET_KEY }}"
        LIVE_SERVER_SECRET_KEY: "{{ .LIVE_SERVER_SECRET_KEY }}"
        # postgres
        POSTGRES_USER: plane
        POSTGRES_DB: plane
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        # rabbitmq
        RABBITMQ_DEFAULT_USER: plane
        RABBITMQ_DEFAULT_PASS: "{{ .RABBITMQ_DEFAULT_PASS }}"
        # minio / doc store
        USE_MINIO: "1"
        MINIO_ROOT_USER: plane-admin
        MINIO_ROOT_PASSWORD: "{{ .MINIO_ROOT_PASSWORD }}"
        AWS_ACCESS_KEY_ID: plane-admin
        AWS_SECRET_ACCESS_KEY: "{{ .MINIO_ROOT_PASSWORD }}"
        AWS_S3_BUCKET_NAME: uploads
        AWS_S3_ENDPOINT_URL: http://plane-minio:9000
        FILE_SIZE_LIMIT: "5242880"
        # connection strings (app + live)
        REDIS_URL: redis://plane-redis.plane.svc.cluster.local:6379/
        DATABASE_URL: "postgresql://plane:{{ .POSTGRES_PASSWORD }}@plane-pgdb.plane.svc.cluster.local/plane"
        AMQP_URL: "amqp://plane:{{ .RABBITMQ_DEFAULT_PASS }}@plane-rabbitmq.plane.svc.cluster.local/"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: plane-passwords
