apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Repo-side half of the Plane app; the workloads come from the plane-ce
# Helm chart (apps/argocd-apps/plane.yaml).
resources:
  - namespace.yaml
  - resourcequota.yaml
  - ingress.yaml
  # Generated by sealing locally, never hand-written: holds plane-app-keys,
  # plane-pgdb, plane-rabbitmq, plane-doc-store, plane-app-env and
  # plane-live-env (names referenced by external_secrets in the chart values).
  - sealed-secrets.yaml
