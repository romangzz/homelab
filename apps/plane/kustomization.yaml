apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Repo-side half of the Plane app; the workloads come from the plane-ce
# Helm chart (apps/argocd-apps/plane.yaml).
resources:
  - namespace.yaml
  - resourcequota.yaml
  - ingress.yaml
  # ESO Password generator + ExternalSecret -> Secret plane-secrets, the
  # single Secret every external_secrets.* hook in the chart values uses.
  - generated-secrets.yaml
