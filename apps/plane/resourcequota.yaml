# Sizing: the chart's 7 app workloads (api, worker, beat-worker, web, space,
# admin, live) each set 50m/50Mi requests and 500m/1000Mi limits. The 4
# bundled datastores (postgres, redis, rabbitmq, minio) and the 2 Jobs
# (migrator, minio-bucket) set none, so they get the LimitRange defaults
# below. Headroom covers one RollingUpdate surge pod at a time.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: plane-quota
  namespace: plane
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "10"
    limits.memory: 16Gi
    pods: "20"
    persistentvolumeclaims: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: plane-limits
  namespace: plane
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 1Gi
