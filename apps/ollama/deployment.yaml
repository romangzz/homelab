apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      runtimeClassName: nvidia
      tolerations:
      - operator: "Exists"
      containers:
      - name: ollama
        image: ollama/ollama:0.32.15
        ports:
        - containerPort: 11434
          name: api
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_KEEP_ALIVE
          value: "30m"
        # Ollama defaults every model to a 4096-token context window, which
        # is too small for agentic tool-calling (opencode et al recommend
        # 64k+). Raised to 32768 as the ceiling that comfortably fits a
        # 14B model (e.g. qwen2.5-coder:14b) alongside flash attention +
        # q8_0 KV cache on this 16Gi GPU; going to 64k gets tight once
        # weights + KV cache + compute buffer are accounted for.
        - name: OLLAMA_CONTEXT_LENGTH
          value: "32768"
        # Single-user homelab box: one concurrent request slot means the
        # full context budget above goes to that slot instead of being
        # divided across OLLAMA_NUM_PARALLEL's default of 4 slots.
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        - name: OLLAMA_FLASH_ATTENTION
          value: "1"
        - name: OLLAMA_KV_CACHE_TYPE
          value: "q8_0"
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 16Gi
            # Requests both physical GPUs (see nvidia-device-plugin's
            # configmap: time-slicing is off, so nvidia.com/gpu has
            # capacity exactly 2 and this always resolves to one RTX 5060
            # Ti + one RTX 4060 Ti, not two slices of the same card).
            # Lets Ollama split a model across both when it doesn't fit in
            # a single 16Gi card. Note: Blackwell + Ada have different
            # compute capability, so a split model runs at the slower
            # card's pace for any cross-GPU synchronization -- worse
            # per-token throughput than either card alone for models that
            # *do* fit in 16Gi.
            nvidia.com/gpu: 2
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-storage
