apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-storage
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  # Binds to a pre-existing volume that predates this repo (created
  # 2026-06-25, before vLLM/Ollama was managed here at all), same
  # situation as apps/media/pvc.yaml's media-pvc -- storageClassName
  # and volumeMode have to match that volume exactly, or ArgoCD's sync
  # treats the missing fields as a change to apply and fails trying to
  # patch an effectively-immutable PVC field.
  storageClassName: local-path
  volumeMode: Filesystem
  resources:
    requests:
      # Matches the volume's actual live capacity. local-path's
      # StorageClass doesn't support resize, so declaring anything
      # else here just makes ArgoCD retry an impossible resize patch.
      # Also note: local-path doesn't enforce this as a hard quota --
      # actual usage already exceeds it (~86Gi of pulled models).
      storage: 50Gi
