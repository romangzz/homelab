# Local copy of apps/authelia/middleware.yaml -- see comment there, and in
# apps/argocd-apps/argocd-authelia-middleware.yaml, for why this isn't a
# cross-namespace reference.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia-forwardauth
  namespace: omada
spec:
  forwardAuth:
    address: "http://authelia.auth.svc.cluster.local/api/verify?rd=https://auth.home.romangzz.com"
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
