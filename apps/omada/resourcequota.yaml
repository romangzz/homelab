apiVersion: v1
kind: ResourceQuota
metadata:
  name: omada-quota
  namespace: omada
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "2"
    limits.memory: 3Gi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: omada-limits
  namespace: omada
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
