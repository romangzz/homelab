apiVersion: v1
kind: ResourceQuota
metadata:
  name: tailscale-quota
  namespace: tailscale
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 256Mi
    limits.cpu: "1"
    limits.memory: 512Mi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tailscale-limits
  namespace: tailscale
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 256Mi
