apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-quota
  namespace: ai
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 10Gi
    limits.cpu: "10"
    limits.memory: 24Gi
    requests.nvidia.com/gpu-5060ti: "1"
    requests.nvidia.com/gpu-4060ti: "1"
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-limits
  namespace: ai
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
