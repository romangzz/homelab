apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
  namespace: ai
data:
  config.yaml: |
    model:
      provider: "custom"
      default: "qwen2.5-coder:14b"
      base_url: "http://ollama-service.ai.svc.cluster.local:11434/v1"
      api_key: "ollama-no-key-needed"
      context_length: 65536
    compression:
      enabled: true
      threshold: 0.40
      target_ratio: 0.2
      protect_last_n: 15
      protect_first_n: 3
