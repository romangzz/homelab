apiVersion: apps/v1
kind: Deployment
metadata:
  name: subgen
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: subgen
  template:
    metadata:
      labels:
        app: subgen
    spec:
      # GPU transcription is available (runtimeClassName: nvidia + set
      # TRANSCRIBE_DEVICE to "cuda" below) but left off by default: the
      # node only has one physical GPU and the media namespace's
      # ResourceQuota only allows requests.nvidia.com/gpu: "1", which
      # Jellyfin's hardware transcoding already claims. Enabling it here
      # too would leave one of the two pods permanently unschedulable.
      # runtimeClassName: nvidia
      containers:
      - name: subgen
        image: mccloud/subgen:latest
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 9000
          name: http
        env:
        - name: WHISPER_MODEL
          value: "base"
        - name: TRANSCRIBE_DEVICE
          value: "cpu"
        - name: TZ
          value: "Europe/Madrid"
        # Persists the downloaded model across restarts instead of
        # re-fetching it from the internet every time (HF_HOME is the
        # standard huggingface_hub cache-location override).
        - name: HF_HOME
          value: "/cache"
        resources:
          limits:
            memory: 2Gi
            cpu: "2"
            # nvidia.com/gpu: 1
          requests:
            memory: 512Mi
            cpu: 250m
        volumeMounts:
        - name: model-cache
          mountPath: /cache
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: subgen-model-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: subgen-service
spec:
  ports:
  - port: 9000
    targetPort: 9000
    name: http
  selector:
    app: subgen
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: subgen-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  ingressClassName: traefik
  rules:
  - host: subgen.home.romangzz.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: subgen-service
            port:
              number: 9000
