# Self-service request portal: browses trending/popular/upcoming movies
# and shows (via TMDB) and forwards requests to Radarr/Sonarr, entered
# through its own UI, same pattern as Prowlarr's indexers and
# Cleanuparr's download client.
#
# Seerr is the successor to Jellyseerr (Jellyseerr + Overseerr merged
# into this project in Feb 2026, both predecessors now deprecated). It
# reuses jellyseerr-config-pvc -- see the comment on that PVC in
# pvc.yaml -- so it auto-migrates the existing Jellyseerr DB (users,
# requests, Jellyfin/Radarr/Sonarr connections) on first boot.
#
# Deliberately NOT put behind Authelia's forwardAuth, unlike most admin
# UIs in this repo: Seerr is meant to be used by every household
# member (it has its own login, backed by Jellyfin accounts), not just
# the Authelia admin user -- same reasoning as why Jellyfin itself skips
# the middleware.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - jellyfin
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: seerr
        image: ghcr.io/seerr-team/seerr:latest
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 5055
          name: http
        env:
        - name: TZ
          value: "Europe/Madrid"
        resources:
          limits:
            memory: 512Mi
            cpu: "1"
          requests:
            memory: 128Mi
            cpu: 100m
        volumeMounts:
        - name: config
          mountPath: /app/config
      volumes:
      - name: config
        persistentVolumeClaim:
          # Keeps the pre-existing Jellyseerr claim name so Seerr binds
          # to the same PVC/data on first boot instead of a fresh empty
          # one -- see pvc.yaml.
          claimName: jellyseerr-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: seerr-service
spec:
  ports:
  - port: 5055
    targetPort: 5055
    name: http
  selector:
    app: seerr
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  ingressClassName: traefik
  rules:
  - host: seerr.home.romangzz.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: seerr-service
            port:
              number: 5055
