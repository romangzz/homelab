apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-device-plugin-shared
  namespace: kube-system
data:
  sharing-config: |
    version: v1
    # No time-slicing: this plugin build (v0.19.3) also hard-disables
    # per-GPU resource renaming on every start (calls
    # DisableResourceNamingInConfig, which wipes config.Resources and logs
    # "Customizing the 'resources' field is not yet supported... Ignoring"),
    # so there is no supported way to give the two physical cards distinct
    # resource names here. With time-slicing off, nvidia.com/gpu has
    # capacity exactly 2 -- one unit per physical GPU, no replicated/
    # duplicate-UUID slices -- so a pod requesting nvidia.com/gpu: 2 is
    # necessarily handed both distinct cards; that's how Ollama gets
    # guaranteed access to both GPUs to split a model across (see
    # apps/ollama/deployment.yaml). Time-slicing replicas previously set
    # here (10x) had no active consumer anyway -- Jellyfin/subgen's GPU
    # use is currently disabled/CPU-only.
